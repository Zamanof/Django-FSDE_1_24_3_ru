{% extends "base.html" %}
{% block title %}Knowledge Hub - Note Details{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9 col-xl-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h2 mb-3">{{ note.title }}</h1>

                <div class="mb-4">
                    <p class="mb-0 text-muted">Author: {{ note.author.username }}</p>
                </div>

                <div class="bg-light rounded-3 p-3 p-md-4 mb-4">
                    <p class="mb-0" style="white-space: pre-wrap;">{{ note.content }}</p>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <a href="{% url 'notes:note_update' note.id %}" class="btn btn-primary">Edit</a>
                    <a href="{% url 'notes:note_delete' note.id %}" class="btn btn-outline-danger">Delete</a>
                    <a href="{% url 'notes:notes_list' %}" class="btn btn-outline-secondary">Back to List</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
