<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>First html from Fast Api</title>
</head>
<body>
    <h3>Hello World</h3>
    <form method="post">
        <p>
            <label for="email">
                Email
            </label>
        </p>
        <p>
            <input type="email" name="email" id="email">
        </p>

         <p>
            <label for="password">
                Password
            </label>
        </p>
        <p>
            <input type="password" name="password" id="password">
        </p>
        <p>
            <button type="submit">
                Sign In
            </button>
        </p>
    </form>

</body>
</html>
